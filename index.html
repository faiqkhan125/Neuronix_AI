<!doctype html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 1. Primary Page Title -->
    <title>Neuronix AI | Generative AI Course</title>
    
    <!-- 2. Meta Description -->
    <meta 
      name="description" 
      content="Learn Generative AI with Neuronix AI through live online classes, practical learning, prompt engineering, AI tools, automation, AI agents and real-world AI projects." 
    />
    
    <!-- 3. Relevant Keywords -->
    <meta 
      name="keywords" 
      content="Neuronix AI, Generative AI Course, Generative AI Training, Learn Generative AI, AI Course, Generative AI Classes, Prompt Engineering, AI Agents, AI Automation, AI Tools, Online AI Course" 
    />
    <meta name="author" content="Neuronix AI" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#050B17" />

    <!-- Official Neuronix AI Favicon & Touch Icon Suite -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Canonical URL: Update with your custom production domain if different -->
    <link rel="canonical" href="https://neuronix.ai/" />

    <!-- Open Graph Metadata with Official Neuronix AI Brand Asset -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Neuronix AI" />
    <meta property="og:title" content="Neuronix AI | Generative AI Course" />
    <meta 
      property="og:description" 
      content="Learn Generative AI with Neuronix AI through live online classes, practical learning, prompt engineering, AI tools, automation, AI agents and real-world AI projects." 
    />
    <meta property="og:url" content="https://neuronix.ai/" />
    <meta property="og:image" content="/neuronix_logo.png" />
    <meta property="og:image:alt" content="Neuronix AI" />
    <meta property="og:locale" content="en_US" />

    <!-- Twitter Card Metadata -->
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Neuronix AI | Generative AI Course" />
    <meta 
      name="twitter:description" 
      content="Learn Generative AI with Neuronix AI through live online classes, practical learning, prompt engineering, AI tools, automation, AI agents and real-world AI projects." 
    />
    <meta name="twitter:image" content="/neuronix_logo.png" />
    <meta name="twitter:image:alt" content="Neuronix AI" />

    <!-- Google Fonts Preconnect & Display -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,300..800;1,300..800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

    <!-- Schema.org JSON-LD Structured Data: Course & FAQPage -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Course",
          "name": "Generative AI Course",
          "description": "Learn Generative AI with Neuronix AI through live online classes, practical learning, prompt engineering, AI tools, automation, AI agents and real-world AI projects.",
          "image": "https://neuronix.ai/neuronix_logo.png",
          "provider": {
            "@type": "EducationalOrganization",
            "name": "Neuronix AI",
            "url": "https://neuronix.ai/",
            "logo": "https://neuronix.ai/neuronix_logo.png"
          },
          "hasCourseInstance": {
            "@type": "CourseInstance",
            "courseMode": "Online"
          },
          "teaches": [
            "Introduction to Generative AI",
            "How Generative AI Works",
            "Large Language Models (LLMs)",
            "Prompt Engineering",
            "AI Chatbots",
            "AI Image Generation",
            "AI Content Generation",
            "AI Automation",
            "AI Agents",
            "Working with AI APIs",
            "Building AI-Powered Applications",
            "Real-World Generative AI Use Cases"
          ]
        },
        {
          "@type": "FAQPage",
          "mainEntity": [
            {
              "@type": "Question",
              "name": "Do I need a technical background or coding experience to join?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "No. The course starts with beginner-friendly foundations and progressively builds toward practical AI tools, prompt engineering, and real-world applications."
              }
            },
            {
              "@type": "Question",
              "name": "How are the live classes conducted?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Classes are conducted 100% online through live interactive sessions on Google Meet or Zoom. You can ask questions, participate in discussions, and code along."
              }
            },
            {
              "@type": "Question",
              "name": "What practical skills will I gain from the course?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "You will master prompt engineering, understand large language models, build AI chatbots and agents, utilize modern generative AI tools, and create real-world AI workflows."
              }
            },
            {
              "@type": "Question",
              "name": "How can I apply for the course?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Click any 'Apply Now' button on the website to open the official Google Form application and submit your candidate details."
              }
            }
          ]
        }
      ]
    }
    </script>
  </head>
  <body class="bg-[#050B17] text-slate-100 antialiased selection:bg-blue-500 selection:text-white overflow-x-hidden">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
